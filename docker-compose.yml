services:
  mysql:
    image: mysql:8.4
    container_name: taskflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflowpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskflow_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflowpass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taskflow_net

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - taskflow_net

volumes:
  mysql_data:

networks:
  taskflow_net:
    driver: bridge
